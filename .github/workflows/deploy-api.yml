name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - 'DatingApp.API/**'
      - '.github/workflows/deploy-api.yml'

env:
  ACR_LOGIN_SERVER: datingappacre82d76.azurecr.io
  IMAGE_NAME: datingapp-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: DatingApp.API
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # Pushing the :latest tag above fires the ACR webhook, which triggers
      # App Service to pull the new image and restart automatically.
