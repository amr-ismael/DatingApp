name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - 'DatingApp.API/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        working-directory: DatingApp.API
        run: dotnet publish -c Release -o ./publish

      - name: Zip publish output
        working-directory: DatingApp.API/publish
        run: zip -r ../release.zip .

      - name: Deploy via Kudu ZipDeploy
        working-directory: DatingApp.API
        run: |
          curl -fL -X POST \
            -H "Authorization: Basic ${{ secrets.AZURE_API_KUDU_AUTH }}" \
            -H "Content-Type: application/zip" \
            --data-binary @release.zip \
            "https://datingapp-api-e82d76.scm.azurewebsites.net/api/zipdeploy"
